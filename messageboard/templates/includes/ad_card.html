{% load static %}

<div class="card h-100 shadow-sm hover-shadow">
    <div class="card-body">
        <h5 class="card-title">{{ ad.title|truncatechars:50 }}</h5>
        
        <p class="card-text text-muted small">
            <i class="bi bi-geo-alt"></i> {{ ad.city|default:"Город не указан" }}<br>
            <i class="bi bi-clock"></i> {{ ad.created_at|date:"d.m.Y" }}
        </p>
        
        <p class="card-text">{{ ad.description|truncatewords:15 }}</p>
        
        <div class="d-flex justify-content-between align-items-center">
            <span class="h5 text-primary mb-0">Цена - {{ ad.price|default:"не указана" }} ₽</span>
            <span class="badge bg-info">{{ ad.get_ad_type_display }}</span>
        </div>
    </div>
    
    <div class="card-footer bg-white">
        <a href="{% url 'board:ad_detail' ad.pk %}" class="btn btn-outline-primary w-100">
            <i class="bi bi-eye"></i> Подробнее
        </a>
    </div>
</div>
